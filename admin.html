<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة إدارة F90 CARD</title>
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>F90 CARD</h1>
    <span>لوحة الإدارة</span>
    <button id="logoutButton" hidden>تسجيل الخروج</button>
  </header>

  <main class="container">
    <section id="loginSection" class="panel">
      <h2>تسجيل دخول المدير</h2>
      <form id="loginForm">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" required autocomplete="username">

        <label for="password">كلمة المرور</label>
        <input id="password" type="password" required autocomplete="current-password">

        <button type="submit">دخول</button>
      </form>
      <p id="loginMessage" role="status"></p>
    </section>

    <section id="dashboard" hidden>
      <nav class="navigation">
        <button data-tab="products">المنتجات</button>
        <button data-tab="categories">التصنيفات</button>
        <button data-tab="banners">الإعلانات</button>
        <button data-tab="settings">إعدادات المتجر</button>
      </nav>

      <section id="products" class="panel admin-tab">
        <h2>إدارة المنتجات</h2>

        <form id="productForm">
          <input id="productId" type="hidden">

          <label for="productName">اسم المنتج</label>
          <input id="productName" required maxlength="150">

          <label for="productSlug">الرابط المختصر (Slug)</label>
          <input id="productSlug" required maxlength="150">

          <label for="productDescription">الوصف</label>
          <textarea id="productDescription"></textarea>

          <label for="productPrice">السعر</label>
          <input id="productPrice" type="number" min="0" step="0.01" required>

          <label for="productCurrency">العملة</label>
          <select id="productCurrency">
            <option value="ILS">شيكل (ILS)</option>
            <option value="USD">دولار (USD)</option>
            <option value="JOD">دينار (JOD)</option>
          </select>

          <label for="productCategory">التصنيف</label>
          <select id="productCategory">
            <option value="">بدون تصنيف</option>
          </select>

          <label for="productStock">المخزون</label>
          <input id="productStock" type="number" min="0" placeholder="اتركه فارغًا للمخزون غير المحدد">

          <label for="productImage">صورة المنتج</label>
          <input id="productImage" type="file" accept="image/jpeg,image/png,image/webp">

          <label>
            <input id="productActive" type="checkbox">
            نشر المنتج
          </label>

          <label>
            <input id="productFeatured" type="checkbox">
            منتج مميز
          </label>

          <button type="submit">حفظ المنتج</button>
          <button type="button" id="cancelProduct">إلغاء التعديل</button>
        </form>

        <div id="productList"></div>
      </section>

      <section id="categories" class="panel admin-tab" hidden>
        <h2>إدارة التصنيفات</h2>

        <form id="categoryForm">
          <input id="categoryId" type="hidden">

          <label for="categoryName">اسم التصنيف</label>
          <input id="categoryName" required>

          <label for="categorySlug">Slug</label>
          <input id="categorySlug" required>

          <label for="categoryDescription">الوصف</label>
          <textarea id="categoryDescription"></textarea>

          <label for="categoryImage">الصورة</label>
          <input id="categoryImage" type="file" accept="image/jpeg,image/png,image/webp">

          <label>
            <input id="categoryActive" type="checkbox" checked>
            تصنيف نشط
          </label>

          <button type="submit">حفظ التصنيف</button>
        </form>

        <div id="categoryList"></div>
      </section>

      <section id="banners" class="panel admin-tab" hidden>
        <h2>إدارة الإعلانات</h2>

        <form id="bannerForm">
          <input id="bannerId" type="hidden">

          <label for="bannerTitle">عنوان الإعلان</label>
          <input id="bannerTitle" required>

          <label for="bannerSubtitle">الوصف</label>
          <textarea id="bannerSubtitle"></textarea>

          <label for="bannerImage">صورة الإعلان</label>
          <input id="bannerImage" type="file" accept="image/jpeg,image/png,image/webp">

          <label for="bannerLink">رابط الإعلان</label>
          <input id="bannerLink" type="url" placeholder="https://example.com">

          <label>
            <input id="bannerActive" type="checkbox">
            نشر الإعلان
          </label>

          <button type="submit">حفظ الإعلان</button>
        </form>

        <div id="bannerList"></div>
      </section>

      <section id="settings" class="panel admin-tab" hidden>
        <h2>إعدادات المتجر</h2>

        <form id="settingsForm">
          <label for="storeName">اسم المتجر</label>
          <input id="storeName" required>

          <label for="storeLogo">الشعار</label>
          <input id="storeLogo" type="file" accept="image/jpeg,image/png,image/webp">

          <label for="storeColor">اللون الرئيسي</label>
          <input id="storeColor" type="color" value="#2563eb">

          <label for="storeCurrency">العملة الافتراضية</label>
          <select id="storeCurrency">
            <option value="ILS">ILS</option>
            <option value="USD">USD</option>
            <option value="JOD">JOD</option>
          </select>

          <label for="storeAnnouncement">الإعلان العلوي</label>
          <textarea id="storeAnnouncement"></textarea>

          <label for="storeEmail">بريد التواصل</label>
          <input id="storeEmail" type="email">

          <button type="submit">حفظ الإعدادات</button>
        </form>
      </section>
    </section>

    <p id="statusMessage" role="status"></p>
  </main>
</body>
</html>
