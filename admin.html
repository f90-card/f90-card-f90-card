  <body class="admin-body">
    <header class="admin-top">
      <button
        class="icon-button"
        id="adminMenu"
        aria-label="قائمة الإدارة"
      ></button

        ><span id="adminIdentity" class="muted small"></span>

      </aside>
      <main id="adminMain" class="admin-main" tabindex="-1">
        <div class="loading">جارٍ التحقق من الصلاحيات…</div>
      </main>
    </div>
