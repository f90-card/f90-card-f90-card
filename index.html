<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d12" />
    <meta
      name="description"
      content="أف تسعين كارد — عالم الخدمات الرقمية. محفظتك، طلباتك، وكل ما تحتاجه في مكان واحد."
    />
    <title>أف تسعين كارد</title>
    <link rel="icon" id="siteFavicon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./f90-logo.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      try {
        document.documentElement.dataset.theme =
          ["dark", "cream", "melon"].includes(localStorage.getItem("f90-theme")) ? localStorage.getItem("f90-theme") : "dark";
      } catch {}
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"
      defer
    ></script>
    <script src="./config.js" defer></script>
    <script src="./store-core.js" defer></script>
    <script src="./api.js" defer></script>
    <script src="./reports.js" defer></script>
    <script src="./app.js" defer></script>
    <script src="./theme-effects.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#mainContent">إلى المحتوى</a>
    <header class="site-header">
      <div class="header-inner container">
        <button
          class="icon-button"
          id="menuButton"
          aria-label="القائمة"
          aria-controls="drawer"
          aria-expanded="false"
        ></button
        ><a
          class="brand"
          href="#/"
          id="headerBrand"
          aria-label="أف تسعين كارد"
        ></a>
        <form class="header-search" id="searchForm">
          <label class="sr-only" for="globalSearch">ابحث عن خدمة</label
          ><input
            id="globalSearch"
            type="search"
            placeholder="ما الخدمة التي تبحث عنها؟"
            autocomplete="off"
          /><button
            class="icon-button"
            type="submit"
            id="searchButton"
            aria-label="بحث"
          ></button>
        </form>
        <div class="header-actions">
          <a class="wallet-chip" href="#/wallet" id="headerWallet"></a
          ><button
            class="icon-button"
            id="themeButton"
            aria-label="تغيير المظهر"
          ></button
          ><a
            class="avatar-button"
            id="headerUser"
            href="#/profile"
            aria-label="حسابي"
          ></a>
        </div>
      </div>
      <nav
        class="top-nav container"
        id="categoryNav"
        aria-label="أقسام المتجر"
      ></nav>
    </header>
    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <aside
      class="drawer"
      id="drawer"
      role="dialog"
      aria-modal="true"
      aria-labelledby="drawerTitle"
      hidden
    >
      <div class="drawer-head">
        <strong id="drawerTitle">عالمك الرقمي</strong
        ><button
          class="icon-button"
          id="drawerClose"
          aria-label="إغلاق"
        ></button>
      </div>
      <div id="drawerProfile"></div>
      <nav id="drawerLinks"></nav>
      <div class="drawer-preferences">
        <label>العملة<select id="currencySelect"></select></label
        ><label
          >مظهر الموقع<select id="themeSelect">
            <option value="dark">أسود وأحمر</option>
            <option value="cream">حليبي دافئ</option>
            <option value="melon">بطيخي سماوي متحرك</option>
          </select></label
        >
      </div>
      <button class="button secondary" id="f90BotToggle" type="button" aria-pressed="true">إخفاء بوت F90</button>
      <label class="f90-effects-setting">مؤثرات الثيم<select id="f90EffectsLevel"><option value="off">إيقاف</option><option value="soft">خفيفة</option><option value="full">كاملة</option></select></label>
      <button class="button secondary" id="installButton" hidden>
        تثبيت أف تسعين كارد
      </button>
      <p class="muted small">فلسطين · رام الله</p>
    </aside>
    <div id="promotionBar" class="promotion" hidden></div>
    <main
      id="mainContent"
      class="container main-content"
      tabindex="-1"
      aria-live="polite"
    >
      <div class="loading">جارٍ تجهيز عالمك الرقمي…</div>
    </main>
    <footer class="site-footer" id="footer"></footer>
    <div class="toast" id="toast" role="status" hidden></div>
    <div id="modalRoot"></div>
  </body>
</html>
