<!doctype html>

    />

    <link rel="icon" id="siteFavicon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./f90-logo.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=20261014-12" />
    <link rel="stylesheet" href="./f90-workspace.css?v=20261014-1" />
    <link rel="stylesheet" href="./f90-experience.css?v=20261014-1" />
    <link rel="stylesheet" href="./f90-responsive.css?v=20261014-2" />
    <link rel="stylesheet" href="./f90-notifications.css?v=20261014-1" />
    <link rel="stylesheet" href="./f90-history.css?v=20261014-1" />
    <link rel="stylesheet" href="./f90-checkout-ui.css?v=20261014-5" />
    <link rel="stylesheet" href="./f90-ticker-refine.css?v=20261014-2" />

    <link rel="stylesheet" href="./f90-atmosphere-v2.css?v=2" /><link rel="stylesheet" href="./f90-profile-deposit.css?v=4" />
    <link rel="stylesheet" href="./f90-nav-refresh.css?v=12" />
    <link rel="stylesheet" href="./f90-deposit-refresh.css?v=3" />
    <link rel="stylesheet" href="./f90-vip-refresh.css?v=1" />
    <script>
      try {
        document.documentElement.dataset.theme =
          ["dark", "cream"].includes(localStorage.getItem("f90-theme")) ? localStorage.getItem("f90-theme") : "dark";
      } catch {}
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"
      defer
    ></script>
    <script src="./config.js?v=20261014-2" defer></script>
    <script src="./store-core.js" defer></script>
    <script src="./api.js?v=20261014-5" defer></script>
    <script src="./reports.js?v=20261013-12" defer></script>
    <script src="./f90-quran.js?v=20261014-9" defer></script>
    <script src="./app.js?v=20261014-59" defer></script>
      <link rel="stylesheet" href="./f90-social.css?v=1" />
  </head>
  <body>
    <a class="skip-link" href="#mainContent">إلى المحتوى</a>
    <header class="site-header">
      <div class="header-inner container">
        <a
          class="brand"
          href="#/"
          id="headerBrand"
          aria-label="أف تسعين كارد"
        ></a>
        <form class="header-search" id="searchForm">
          <label class="sr-only" for="globalSearch">ابحث عن خدمة</label
          ><input
            id="globalSearch"
            type="search"
            placeholder="ما الخدمة التي تبحث عنها؟"
            autocomplete="off"
          /><button
            class="icon-button"
            type="submit"
            id="searchButton"
            aria-label="بحث"
          ></button>
        </form>
        
        <div class="header-actions">
          <a class="icon-button f90-header-bell" id="storeBell" href="#/notifications" aria-label="الأخبار والإشعارات" title="الأخبار والإشعارات"><svg class="f90-bell-svg" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><span class="f90-bell-count" id="storeBellCount" hidden></span></a>
          <a class="wallet-chip" href="#/wallet" id="headerWallet"></a>
          <button
            class="icon-button"
            id="menuButton"
            aria-label="القائمة"
            aria-controls="drawer"
            aria-expanded="false"
          ></button>
        </div>
      </div>
      <nav
        class="top-nav container"
        id="categoryNav"
        aria-label="أقسام المتجر"
      ></nav>
    </header>
    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <aside
      class="drawer"
      id="drawer"
      role="dialog"
      aria-modal="true"
      aria-labelledby="drawerTitle"
      hidden
    >
      <div class="drawer-head">
        <strong id="drawerTitle">عالمك الرقمي</strong
        ><button
          class="icon-button"
          id="drawerClose"
          aria-label="إغلاق"
        ></button>
      </div>
      <div id="drawerProfile"></div>
      <nav id="drawerLinks"></nav>
      <div class="drawer-preferences">
<button type="button" id="themeToggle" class="f90-theme-toggle" aria-label="تبديل مظهر الموقع" aria-pressed="false"><span class="f90-theme-toggle-icon" aria-hidden="true">☾</span><span class="f90-theme-toggle-label">تفعيل الثيم الفاتح</span><span class="f90-theme-toggle-track" aria-hidden="true"><i></i></span></button>
        <label>العملة<select id="currencySelect"></select></label
        >
      </div>
      <button class="button secondary" id="installButton" hidden>
        تثبيت أف تسعين كارد
      </button>
      <p class="muted small">فلسطين · رام الله</p>
    </aside>
    <section id="f90LiveQuran" class="f90-live-quran" aria-label="إذاعة القرآن الكريم المباشرة">
      <div class="f90-live-quran-title"><span aria-hidden="true">۞</span><span>إذاعة القرآن الكريم</span><small>بث متواصل</small></div>
      <audio controls preload="none" playsinline aria-label="تشغيل الإذاعة القرآنية المباشرة" src="https://Qurango.net/radio/alzain_mohammad_ahmad"></audio>
      <a href="https://www.mp3quran.net/ar/live" target="_blank" rel="noopener noreferrer" aria-label="فتح مصدر البث القرآني">المصدر</a>
    </section>
    <div id="promotionBar" class="promotion" hidden></div>
    <main
      id="mainContent"
      class="container main-content"
      tabindex="-1"
      aria-live="polite"
    >
      <div class="loading">جارٍ تجهيز عالمك الرقمي…</div>
    </main>
    <nav id="mobileDock" class="f90-mobile-dock" aria-label="التنقل السريع"></nav>
    <footer class="site-footer" id="footer"></footer>
    <div class="toast" id="toast" role="status" hidden></div>
    <div id="modalRoot"></div>
  </body>
</html>
