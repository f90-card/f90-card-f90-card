<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080a0f" />
    <meta
      name="description"
      content="F90 CARD | اف تسعين كارد — الخدمات والمنتجات الرقمية"
    />
    <title>F90 CARD | اف تسعين كارد</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("f90-theme") === "cream" ? "cream" : "dark";
      } catch {}
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"
      defer
    ></script>
    <script src="./config.js" defer></script>
    <script src="./store-core.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#mainContent" data-i18n="discover"
      >اكتشف الخدمات</a
    >
    <header class="site-header">
      <div class="header-inner container">
        <a href="#/" class="brand" id="headerBrand" aria-label="F90 CARD"></a>
        <div class="header-search" id="headerSearchWrap">
          <label class="sr-only" for="globalSearch" data-i18n="search"
            >ابحث عن قسم أو خدمة…</label
          ><span id="searchIcon"></span
          ><input
            id="globalSearch"
            type="search"
            data-placeholder="search"
            placeholder="ابحث عن قسم أو خدمة…"
            autocomplete="off"
          />
        </div>
        <div class="header-actions">
          <button
            class="icon-button locale-button"
            id="languageButton"
            type="button"
            aria-label="اللغة"
          >
            <span id="languageLabel">EN</span>
          </button>
          <button
            class="icon-button"
            id="themeButton"
            type="button"
            data-label="theme"
            aria-label="تغيير الثيم"
          ></button>
          <a
            class="icon-button notification-button"
            href="#/notifications"
            data-label="notifications"
            aria-label="إشعارات الموقع"
            ><span id="bellIcon"></span
            ><span
              class="notification-count"
              id="notificationCount"
              hidden
            ></span
          ></a>
          <button
            class="icon-button menu-button"
            id="menuButton"
            type="button"
            aria-controls="drawer"
            aria-expanded="false"
            data-label="menu"
            aria-label="القائمة"
          ></button>
        </div>
      </div>
      <nav
        class="category-nav container"
        id="categoryNav"
        aria-label="أقسام المتجر"
      ></nav>
    </header>
    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <aside
      class="drawer"
      id="drawer"
      role="dialog"
      aria-modal="true"
      aria-labelledby="drawerTitle"
      hidden
    >
      <div class="drawer-head">
        <strong id="drawerTitle" data-i18n="menu">القائمة</strong
        ><button
          type="button"
          class="icon-button"
          id="drawerClose"
          data-label="close"
          aria-label="إغلاق"
        ></button>
      </div>
      <div class="drawer-brand" id="drawerBrand"></div>
      <nav id="drawerLinks"></nav>
      <div class="drawer-preferences">
        <label for="currencySelect" data-i18n="currency">العملة</label
        ><select id="currencySelect">
          <option value="USD">USD</option>
          <option value="JOD">JOD</option>
          <option value="ILS">ILS</option>
        </select>
        <label for="themeSelect" data-i18n="theme">تغيير الثيم</label
        ><select id="themeSelect">
          <option value="dark" data-i18n="dark">أسود وأحمر</option>
          <option value="cream" data-i18n="cream">حليبي هادئ</option>
        </select>
        <label for="languageSelect" data-i18n="language">اللغة</label
        ><select id="languageSelect">
          <option value="ar">العربية</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="drawer-social" id="drawerSocial"></div>
    </aside>
    <main class="container main-content" id="mainContent" tabindex="-1">
      <div class="loading-state" role="status" data-i18n="loading">
        جارٍ تحميل الخدمات…
      </div>
    </main>
    <footer class="site-footer" id="siteFooter"></footer>
    <div
      class="notification-stack"
      id="notificationStack"
      aria-live="polite"
    ></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <button
      class="back-top icon-button"
      id="backTop"
      type="button"
      data-label="top"
      aria-label="إلى أعلى الصفحة"
      hidden
    >
      ↑
    </button>
    <noscript
      ><p class="empty-state">
        يرجى تفعيل JavaScript لعرض المتجر. Please enable JavaScript to browse
        the store.
      </p></noscript
    >
  </body>
</html>
