name: F90 kinetic video campaign
on:
  push:
    branches: [main]
    paths: ['marketing/creative_motion.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline Arabic graphic and video packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core ffmpeg
          python -m pip install --quiet pillow numpy qrcode
      - name: Produce original motion graphics and original synthesized sound
        run: python marketing/creative_motion.py
      - name: Commit videos
        run: |
          git config user.name 'F90 Campaign Bot'
          git config user.email 'f90-campaign-bot@users.noreply.github.com'
          git add marketing/creative-v2/*.mp4
          if ! git diff --staged --quiet; then
            git commit -m 'marketing: six animated brand reels with original soundtrack'
            git pull --rebase origin main
            git push
          fi
