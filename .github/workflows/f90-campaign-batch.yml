name: Build 10 F90 campaign posts and video reels
on:
  push:
    branches: [main]
    paths: ['marketing/campaign_batch.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open source media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core ffmpeg
          python -m pip install --quiet pillow qrcode
      - name: Render 10 distinct branded posters and videos
        run: python marketing/campaign_batch.py
      - name: Commit exported media assets
        run: |
          git config user.name 'F90 Campaign Bot'
          git config user.email 'f90-campaign-bot@users.noreply.github.com'
          git pull --rebase origin main
          git add marketing/exports/f90-post-*.png marketing/exports/f90-reel-*.mp4
          if ! git diff --staged --quiet; then
            git commit -m 'marketing: 10 official QR posters and 10 original reels'
            git push
          fi
