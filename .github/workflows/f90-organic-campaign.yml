name: Build F90 organic campaign images
on:
  push:
    branches: [main]
    paths: ['marketing/build_assets.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free image libraries and Arabic fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core
          python -m pip install --quiet pillow qrcode
      - name: Render official F90 assets
        run: python marketing/build_assets.py
      - name: Commit generated static posters
        run: |
          git config user.name 'F90 Campaign Bot'
          git config user.email 'f90-campaign-bot@users.noreply.github.com'
          git add marketing/exports/*.png
          if ! git diff --staged --quiet; then
            git commit -m 'assets: official F90 CARD QR campaign posters'
            git push
          fi
