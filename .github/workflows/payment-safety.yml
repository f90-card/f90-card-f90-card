name: Payment safety checks

on:
  push:
    paths:
      - "api.js"
      - "tests/server-guards.test.mjs"
      - "tests/omega-import.test.mjs"
      - "tests/omega-bulk-import.test.mjs"
      - "tests/theme-parity.test.mjs"
      - "theme-effects.js"
      - "styles.css"
      - "index.html"
      - "admin.html"
      - "supabase/functions/f90-platform/provider.mjs"
      - "supabase/functions/f90-platform/index.ts"
      - "app.js"
      - "admin.js"
      - "sw.js"
      - "tests/payment-safety.test.mjs"
      - "tests/session-resilience.test.mjs"
      - ".github/workflows/payment-safety.yml"
  pull_request:
    paths:
      - "api.js"
      - "tests/server-guards.test.mjs"
      - "tests/omega-import.test.mjs"
      - "tests/omega-bulk-import.test.mjs"
      - "tests/theme-parity.test.mjs"
      - "theme-effects.js"
      - "styles.css"
      - "index.html"
      - "admin.html"
      - "supabase/functions/f90-platform/provider.mjs"
      - "supabase/functions/f90-platform/index.ts"
      - "app.js"
      - "tests/payment-safety.test.mjs"
      - "tests/session-resilience.test.mjs"
      - ".github/workflows/payment-safety.yml"

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check api.js
          node --check app.js
          node --check admin.js
          node --check sw.js
      - name: Run payment safety regression tests
        run: node --test tests/*.test.mjs
