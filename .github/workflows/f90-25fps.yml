name: F90 TikTok FPS 25 video compatibility
on:
  push:
    branches: [main]
    paths: ['marketing/fix_video_fps.py']
permissions:
  contents: write
jobs:
  compatible:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Make ten videos 25 FPS and verify metadata
        run: python marketing/fix_video_fps.py
      - name: Commit corrected clips
        run: |
          git config user.name 'F90 Campaign Bot'
          git config user.email 'f90-campaign-bot@users.noreply.github.com'
          git add marketing/creative-v2/*-25fps.mp4 marketing/creative-v3/*-25fps.mp4
          if ! git diff --staged --quiet; then
            git commit -m 'marketing: platform-compatible 25fps master videos'
            git pull --rebase origin main
            git push
          fi
