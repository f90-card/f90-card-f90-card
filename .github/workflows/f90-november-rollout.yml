name: F90 November creative rollout
on:
  push:
    branches: [main]
    paths: ['marketing/creative_november.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core
          pip install --quiet pillow qrcode
      - name: Render digital storefront content
        run: python marketing/creative_november.py
      - name: Save outputs
        run: |
          git config user.name 'F90 Campaign Bot'
          git config user.email 'f90-campaign-bot@users.noreply.github.com'
          git add marketing/november/*.png
          if ! git diff --staged --quiet; then
            git commit -m 'marketing: complete F90 November image pack'
            git pull --rebase origin main
            git push
          fi
