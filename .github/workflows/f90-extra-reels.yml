name: F90 four additional branded motion reels
on:
  push:
    branches: [main]
    paths: ['marketing/creative_motion_extra.py']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core ffmpeg
          pip install --quiet pillow numpy qrcode
      - name: Render four animated videos with original soundtrack
        run: python marketing/creative_motion_extra.py
      - name: Publish completed clips to repository
        run: |
          git config user.name 'F90 Campaign Bot'
          git config user.email 'f90-campaign-bot@users.noreply.github.com'
          git add marketing/creative-v3/*.mp4
          if ! git diff --staged --quiet; then
            git commit -m 'marketing: four additional branded reels with motion'
            git pull --rebase origin main
            git push
          fi
