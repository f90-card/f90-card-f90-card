name: Review F90 motion scenes
on:
  push:
    branches: [main]
    paths:
      - 'marketing/review_motion.py'
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install review tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --quiet pillow
      - name: Export four frames from each video
        run: python marketing/review_motion.py
      - name: Commit inspection sheet
        run: |
          git config user.name 'F90 Campaign Bot'
          git config user.email 'f90-campaign-bot@users.noreply.github.com'
          git add marketing/creative-v2/motion-quality-sheet.jpg
          if ! git diff --staged --quiet; then
            git commit -m 'marketing: QA review grid for new animated campaign'
            git pull --rebase origin main
            git push
          fi
