name: Validate F90 routing and radio album
on:
  push:
    branches: [main]
    paths:
      - 'tests/f90-radio-route-validation.sh'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript syntax
        run: bash tests/f90-radio-route-validation.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check Edge Function with original import map
        run: |
          cd supabase/functions/f90-platform
          deno check --config deno.json index.ts
